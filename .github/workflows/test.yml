name: Test

# Reusable: ruff lint + pytest suite. Called by ci.yml on every push/PR.
#
# The suite runs against the same Home Assistant the integration targets:
# requirements_test.txt names the pinned 2026.9 dev build; tests use pytest with a
# sys.path conftest, so there is no pytest-homeassistant-custom-component pin
# dragging CI back to an older core.
# yamllint disable-line rule:truthy
on:
  workflow_call:

jobs:
  test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Create the Python 3.14 environment
        run: uv venv --python 3.14

      - name: Install test dependencies
        run: uv pip install ruff -r requirements_test.txt

      # Call the venv binaries directly — `uv run` would treat the repo as a
      # project and editable-install it, but this is a custom_components
      # layout (tests import custom_components.xbloom from the tree).
      - name: Ruff
        run: .venv/bin/ruff check .

      - name: Pytest
        run: .venv/bin/pytest
